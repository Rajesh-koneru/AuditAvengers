<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Audit Avengers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='2.png') }}">
  <style>
    body { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen px-4 py-12 selection:bg-yellow-500 selection:text-black">

  <div class="w-full max-w-md bg-gray-900/90 border border-yellow-500/30 backdrop-blur-xl rounded-2xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex flex-col items-center text-center">
      <a href="/">
        <img src="{{ url_for('static', filename='2.png') }}" alt="Audit Avengers Logo" class="h-14 w-14 rounded-full border-2 border-yellow-500 mb-3 hover:scale-105 transition-transform duration-300">
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Welcome to Audit Avengers</h1>
      <p class="text-xs text-gray-400 mt-1">Empowering Accuracy • Ensuring Integrity</p>
    </div>

    <form class="space-y-5" method="POST" action="/login">
      <div>
        <label for="username" class="block text-xs font-semibold text-gray-300 mb-1.5">Username / Auditor ID</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-user"></i></span>
          <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter username or Auditor ID" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-lock"></i></span>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter password" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-12 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
          <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-yellow-400 text-sm focus:outline-none">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center text-gray-400 cursor-pointer">
          <input type="checkbox" name="remember-me" class="rounded bg-gray-950 border-gray-700 text-yellow-500 focus:ring-yellow-500 h-4 w-4 mr-2"/>
          Remember session
        </label>
        <a href="#" onclick="alert('Please contact admin for credential recovery.'); return false;" class="text-yellow-500 hover:text-yellow-400 font-semibold">Forgot Password?</a>
      </div>

      <button type="submit" id="signin" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-yellow-500/20 hover:shadow-yellow-500/40 transition-all duration-200 flex items-center justify-center gap-2">
        <span>Sign In</span>
        <i class="fas fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="border-t border-gray-800 pt-4 text-center text-xs text-gray-400 space-y-2">
      <p>Don't have an account? <a href="/signup_page" class="text-yellow-400 hover:underline font-semibold">Sign Up</a></p>
      <p>Need to apply for an audit assignment? <a href="/audit_card" class="text-yellow-400 hover:underline font-semibold">Browse Open Audits</a></p>
      <div class="pt-2">
        <a href="/" class="text-gray-400 hover:text-yellow-400 inline-flex items-center gap-1 font-medium transition-colors">
          <i class="fas fa-arrow-left text-xs"></i> Back to Homepage
        </a>
      </div>
    </div>
  </div>

  <script>
    const togglePasswordBtn = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener("click", function() {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      });
    }
  </script>
</body>
</html>
