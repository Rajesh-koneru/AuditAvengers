<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Audit Entry | Audit Avengers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='2.png') }}">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-yellow-500 selection:text-black">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-yellow-500/30 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <a href="/" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='2.png') }}" alt="Audit Avengers Logo" class="h-10 w-10 rounded-full border-2 border-yellow-500">
                <span class="font-bold text-xl text-white">Audit Avengers <span class="text-yellow-500 text-xs px-2 py-0.5 rounded bg-yellow-500/10 border border-yellow-500/30 ml-1">NEW AUDIT</span></span>
            </a>

            <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
                <a href="/report" class="text-yellow-400 hover:text-yellow-300 flex items-center gap-1.5"><i class="fas fa-arrow-left text-xs"></i> Back to Master Report</a>
                <a href="/admin/dashboard" class="text-gray-300 hover:text-yellow-400">Dashboard</a>
            </nav>

            <button onclick="toggleMenu()" class="md:hidden text-gray-300 text-2xl focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-gray-900 border-b border-gray-800 px-6 py-4 space-y-3">
            <a href="/report" class="block text-yellow-400 font-semibold">Back to Report</a>
            <a href="/admin/dashboard" class="block text-gray-200">Dashboard</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-10 shadow-2xl">
            <div class="border-b border-gray-800 pb-4 mb-6">
                <h1 class="text-2xl font-extrabold text-white flex items-center gap-2">
                    <i class="fas fa-plus-circle text-yellow-500"></i> Create New Audit Opportunity
                </h1>
                <p class="text-xs text-gray-400 mt-1">Fill in details to publish a new audit requirement for auditors</p>
            </div>

            <form class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Audit ID *</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="audit-name" name="Audit Id" type="text" placeholder="e.g. AA0010" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Audit Type *</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="auditor-name" name="Auditor type" type="text" placeholder="e.g. Financial Audit" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Industry</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="industry" name="industry" type="text" placeholder="e.g. Retail / Manufacturing">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Planned Date</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="planned-date" name="Date" type="date">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Auditors Required</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="state" name="auditor require" type="number" value="1">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Duration (Days)</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="city" name="Day" type="number" value="1">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Qualification Requirement</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="client-name" name="Qualification" type="text" placeholder="e.g. B.Com / CA Inter">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Equipment Needed</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="contact" name="equipment" type="text" placeholder="e.g. Laptop">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Location City</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" name="location" type="text" placeholder="e.g. Hyderabad">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">State</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" name="State" type="text" placeholder="e.g. Telangana">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Compensation Amount (₹)</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" id="payment-amount" name="Amount" type="number" placeholder="1000">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Client ID</label>
                        <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" name="client_id" type="text" placeholder="e.g. CLT01">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Special Requirements / Notes</label>
                    <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" name="requirement" type="text" placeholder="e.g. Night Shift / On-site">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">WhatsApp Group Link</label>
                    <input class="input w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500" name="whatsapp" type="text" placeholder="https://chat.whatsapp.com/...">
                </div>

                <div class="pt-4">
                    <button id="submit" type="button" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-yellow-500/20 hover:shadow-yellow-500/40 transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i> Save & Publish Audit
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-gray-950 border-t border-yellow-500/30 py-6 text-xs text-gray-400 text-center">
        <p>&copy; 2026 Audit Avengers. All rights reserved.</p>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("mobile-menu");
            if (menu) menu.classList.toggle("hidden");
        }
    </script>
    <script src="{{ url_for('static', filename='js/manual.js') }}"></script>
</body>
</html>
