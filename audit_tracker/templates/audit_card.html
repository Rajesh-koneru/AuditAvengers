<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Audit Opportunities | Audit Avengers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='2.png') }}">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col selection:bg-yellow-500 selection:text-black">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-yellow-500/30 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <a href="/" class="flex items-center gap-3">
                <img src="{{ url_for('static', filename='2.png') }}" alt="Audit Avengers Logo" class="h-10 w-10 rounded-full border-2 border-yellow-500">
                <span class="font-bold text-xl text-white">Audit Avengers <span class="text-yellow-500 text-xs px-2 py-0.5 rounded bg-yellow-500/10 border border-yellow-500/30 ml-1">OPPORTUNITIES</span></span>
            </a>

            <nav class="flex items-center gap-6 text-sm font-semibold">
                <a href="/" class="text-gray-300 hover:text-yellow-400 flex items-center gap-1.5"><i class="fas fa-home text-xs"></i> Home</a>
                <a href="/signup_page" class="bg-yellow-500 hover:bg-yellow-400 text-black px-4 py-2 rounded-lg transition-colors text-xs font-bold">Auditor Login</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 mb-3">
                <i class="fas fa-briefcase"></i> Certified Audit Deployments
            </span>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">Available Audit Assignments</h1>
            <p class="text-gray-400 text-sm mt-3">Select an active audit opportunity below to review specifications and submit your application.</p>
        </div>

        <div id="card" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Populated dynamically by auditcard.js -->
            <div class="col-span-full text-center py-12 text-gray-500">Loading open audit cards...</div>
        </div>
    </main>

    <footer class="bg-gray-950 border-t border-yellow-500/30 py-6 text-xs text-gray-400 text-center">
        <p>&copy; 2026 Audit Avengers. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/auditcard.js') }}"></script>
</body>
</html>
