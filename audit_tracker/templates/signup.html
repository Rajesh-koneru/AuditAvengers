<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up | Audit Avengers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='2.png') }}">
  <style>
    body { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen px-4 py-12 selection:bg-yellow-500 selection:text-black">

  <div class="w-full max-w-md bg-gray-900/90 border border-yellow-500/30 backdrop-blur-xl rounded-2xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-yellow-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="flex flex-col items-center text-center">
      <a href="/">
        <img src="{{ url_for('static', filename='2.png') }}" alt="Audit Avengers Logo" class="h-14 w-14 rounded-full border-2 border-yellow-500 mb-3 hover:scale-105 transition-transform duration-300">
      </a>
      <h1 class="text-2xl font-bold text-white tracking-tight">Create an Account</h1>
      <p class="text-xs text-gray-400 mt-1">Register as an Auditor with Audit Avengers</p>
    </div>

    <!-- Alert Box for Validation -->
    <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-medium border flex items-center gap-2"></div>

    <form id="signupForm" class="space-y-4" method="POST" action="/signup">
      <div>
        <label for="auditor_name" class="block text-xs font-semibold text-gray-300 mb-1.5">Full Name / Auditor Name *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-user"></i></span>
          <input id="auditor_name" name="auditor_name" type="text" required placeholder="John Doe" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-gray-300 mb-1.5">Email Address *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-envelope"></i></span>
          <input id="email" name="email" type="email" required placeholder="john@example.com" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label for="phone" class="block text-xs font-semibold text-gray-300 mb-1.5">Phone / Contact Number *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-phone"></i></span>
          <input id="phone" name="phone" type="tel" required placeholder="+91 9876543210" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-300 mb-1.5">Password *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-lock"></i></span>
          <input id="password" name="password" type="password" required minlength="6" placeholder="Create a password (min 6 chars)" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-xs font-semibold text-gray-300 mb-1.5">Confirm Password *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 text-sm"><i class="fas fa-lock"></i></span>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="Re-enter your password" class="w-full bg-gray-950 border border-gray-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors"/>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-yellow-500/20 hover:shadow-yellow-500/40 transition-all duration-200 flex items-center justify-center gap-2 mt-2">
        <span>Register Account</span>
        <i class="fas fa-user-plus text-xs"></i>
      </button>
    </form>

    <div class="border-t border-gray-800 pt-4 text-center text-xs text-gray-400 space-y-2">
      <p>Already have an account? <a href="/login_page" class="text-yellow-400 hover:underline font-semibold">Sign In</a></p>
      <div class="pt-2">
        <a href="/" class="text-gray-400 hover:text-yellow-400 inline-flex items-center gap-1 font-medium transition-colors">
          <i class="fas fa-arrow-left text-xs"></i> Back to Homepage
        </a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const alertBox = document.getElementById('alertBox');

    function showAlert(msg, type = 'error') {
      alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-green-500/10', 'border-green-500/30', 'text-green-400');
      if (type === 'error') {
        alertBox.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
        alertBox.innerHTML = `<i class="fas fa-exclamation-circle"></i> <span>${msg}</span>`;
      } else {
        alertBox.classList.add('bg-green-500/10', 'border-green-500/30', 'text-green-400');
        alertBox.innerHTML = `<i class="fas fa-check-circle"></i> <span>${msg}</span>`;
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const name = document.getElementById('auditor_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (!name || !email || !phone || !password || !confirmPassword) {
        showAlert('Please fill in all required fields.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please try again.');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters long.');
        return;
      }

      try {
        const response = await fetch('/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            auditor_name: name,
            email: email,
            phone: phone,
            password: password,
            confirm_password: confirmPassword
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(data.message || 'Registration successful! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login_page';
          }, 1800);
        } else {
          showAlert(data.error || 'Registration failed. Please check your details.');
        }
      } catch (err) {
        showAlert('Network error. Please try again later.');
      }
    });
  </script>
</body>
</html>
