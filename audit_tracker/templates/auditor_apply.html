<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditor Application | Audit Avengers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='2.png') }}">
  <style>
    body { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

  <header class="bg-gray-900 border-b border-yellow-500/30 py-4">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
      <a href="/" class="flex items-center gap-3">
        <img src="{{ url_for('static', filename='2.png') }}" class="h-10 w-10 rounded-full border-2 border-yellow-500" alt="AA Logo">
        <span class="font-bold text-xl text-white">Audit <span class="text-yellow-500">Avengers</span></span>
      </a>
      <a href="/" class="text-xs font-semibold text-gray-300 hover:text-yellow-400 flex items-center gap-1.5">
        <i class="fas fa-home"></i> Home
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12 w-full">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-yellow-500/10 text-yellow-400 flex items-center justify-center text-xl mx-auto mb-3">
          <i class="fas fa-id-card"></i>
        </div>
        <h2 class="text-2xl font-bold text-white tracking-tight">Auditor Application</h2>
        <p class="text-xs text-gray-400 mt-1">Submit details to register for the selected audit opportunity</p>
      </div>

      <form class="space-y-4">
        <div>
          <label for="name" class="block text-xs font-semibold text-gray-300 mb-1">Full Name *</label>
          <input type="text" id="name" name="name" required placeholder="John Doe" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors">
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-gray-300 mb-1">Email ID *</label>
          <input type="email" id="email" name="email" required placeholder="john@example.com" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors">
        </div>

        <div>
          <label for="phone" class="block text-xs font-semibold text-gray-300 mb-1">Phone Number (WhatsApp) *</label>
          <input type="tel" id="phone" name="phone" required placeholder="+91 9876543210" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-yellow-500 transition-colors">
        </div>

        <button type="submit" id="button" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3.5 rounded-xl shadow-lg shadow-yellow-500/20 hover:shadow-yellow-500/40 transition-all flex items-center justify-center gap-2 mt-4">
          <span>Submit Application</span>
          <i class="fas fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-gray-950 border-t border-yellow-500/30 py-6 text-xs text-gray-400 text-center">
    <p>&copy; 2026 Audit Avengers. All rights reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
